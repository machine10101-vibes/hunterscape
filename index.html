<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0c10" />
    <title>Hunterscape — Thornrest Camp</title>
    <link rel="icon" type="image/svg+xml" href="/hunterscape/favicon.svg" />
    <link rel="apple-touch-icon" href="/hunterscape/favicon.svg" />
    <script type="module" crossorigin src="/hunterscape/assets/index-DuqeQOgw.js"></script>
    <link rel="stylesheet" crossorigin href="/hunterscape/assets/index-BYQTflnz.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud" aria-hidden="false">
        <!-- Top-right: minimap + orbs -->
        <div id="hud-top-right">
          <div id="orbs">
            <div class="orb" id="orb-hp" title="HP">
              <svg viewBox="0 0 64 64" class="orb-ring">
                <circle cx="32" cy="32" r="28" class="orb-track" />
                <circle cx="32" cy="32" r="28" class="orb-fill hp-fill" id="hp-ring" />
              </svg>
              <div class="orb-core hp-core"><span id="hp-text">100</span></div>
              <span class="orb-label">HP</span>
            </div>
            <div class="orb" id="orb-pray" title="Focus">
              <svg viewBox="0 0 64 64" class="orb-ring">
                <circle cx="32" cy="32" r="28" class="orb-track" />
                <circle cx="32" cy="32" r="28" class="orb-fill pray-fill" id="pray-ring" />
              </svg>
              <div class="orb-core pray-core"><span id="pray-text">100</span></div>
              <span class="orb-label">Focus</span>
            </div>
            <div class="orb" id="orb-stam" title="Stamina">
              <svg viewBox="0 0 64 64" class="orb-ring">
                <circle cx="32" cy="32" r="28" class="orb-track" />
                <circle cx="32" cy="32" r="28" class="orb-fill stam-fill" id="stam-ring" />
              </svg>
              <div class="orb-core stam-core"><span id="stam-text">100</span></div>
              <span class="orb-label">Stamina</span>
            </div>
          </div>
          <div id="minimap-wrap">
            <div id="compass-ring" aria-hidden="true"></div>
            <div id="compass-n" title="North" aria-hidden="true"></div>
            <canvas id="minimap" width="160" height="160"></canvas>
            <div id="minimap-label">Thornrest</div>
          </div>
        </div>

        <!-- Skills toggle button -->
        <button type="button" id="btn-skills" title="Skills (K)">⚔ Skills</button>
        <button type="button" id="btn-studio" title="Model Studio (V)">◈ Studio</button>

        <!-- Skills panel -->
        <div id="skills-panel" class="panel" hidden>
          <div class="panel-head">
            <span>Skills</span>
            <button type="button" class="panel-close" id="skills-close" aria-label="Close">✕</button>
          </div>
          <div id="skills-list"></div>
        </div>

        <!-- Chat bottom-left -->
        <div id="chat">
          <div id="chat-log"></div>
          <div id="chat-tabs">
            <span class="chat-tab active">Game</span>
            <span class="chat-tab">Public</span>
            <span class="chat-tab">Private</span>
          </div>
        </div>

        <!-- Action bar bottom-center -->
        <div id="action-bar" aria-label="Action bar">
          <button class="ab-slot" data-action="attack" title="Basic Attack (1)"><span class="ab-icon">⚔</span><span class="ab-key">1</span></button>
          <button class="ab-slot" data-action="chop" title="Chop Tree (2)"><span class="ab-icon">🪓</span><span class="ab-key">2</span></button>
          <button class="ab-slot" data-action="mine" title="Mine Rock (3)"><span class="ab-icon">⛏</span><span class="ab-key">3</span></button>
          <button class="ab-slot" data-action="eat" title="Eat Food (4)"><span class="ab-icon">🍖</span><span class="ab-key">4</span></button>
          <button class="ab-slot" data-action="examine" title="Examine (5)"><span class="ab-icon">👁</span><span class="ab-key">5</span></button>
        </div>

        <!-- Inventory toggle (narrow viewports) -->
        <button type="button" id="btn-inventory" title="Inventory" aria-label="Inventory" aria-expanded="true">🎒</button>

        <!-- Inventory bottom-right -->
        <div id="inventory" class="panel">
          <div class="panel-head">
            <span>Inventory</span>
            <span class="panel-head-right">
              <span id="inv-count">0/28</span>
              <button type="button" class="panel-close" id="inv-close" aria-label="Close inventory">✕</button>
            </span>
          </div>
          <div id="inv-grid"></div>
        </div>

        <!-- Progress bar (gathering/combat) -->
        <div id="progress-wrap" hidden>
          <div id="progress-label">Working…</div>
          <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>

        <!-- Target info -->
        <div id="target-info" hidden>
          <span id="target-name"></span>
          <div class="bar thin"><div id="target-hp"></div></div>
        </div>

        <div id="touch-hint">Tap ground to move · Tap trees, rocks &amp; dummy to interact</div>
      </div>

      <div id="studio" hidden>
        <div id="studio-top">
          <div class="studio-brand">
            <span class="studio-kicker">Inspect</span>
            <span id="studio-model-name">Male Hunter</span>
          </div>
          <span id="studio-hint">Drag to orbit · Scroll to zoom · Shift-drag to pan · Esc to close</span>
          <button type="button" id="studio-close" aria-label="Close studio">✕</button>
        </div>
        <div id="studio-side">
          <div class="panel-head">Models</div>
          <div id="studio-list"></div>
        </div>
        <div id="studio-bottom">
          <div id="studio-poses"></div>
          <div id="studio-tools">
            <button type="button" id="studio-spin" title="Auto-rotate">Spin</button>
            <button type="button" id="studio-reset" title="Reset camera">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
